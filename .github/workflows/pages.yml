# Publishes the static game to GitHub Pages on every push to main.
# Pages itself must be switched on once in the repo settings
# (Settings → Pages → Build and deployment → Source → GitHub Actions).
# enablement is set below, but the default GITHUB_TOKEN is not allowed to
# create the Pages site. After the setting is saved, this workflow deploys.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp build id and stage site
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%d).$(git rev-parse --short HEAD)"
          mkdir -p _site
          tar --exclude _site --exclude .git --exclude .github -cf - . | tar -C _site -xf -
          printf 'window.BOTG_BUILD = "%s";\n' "$STAMP" > _site/js/build.js
          sed -i -E "s/v=2026-11-24[a-z0-9.]*/v=${STAMP}/g" _site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # v5 uploads with actions/upload-artifact v7. Pair it with deploy-pages v5.
      # include-hidden-files keeps .nojekyll in the site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      # The artifact is sometimes invisible to deploy for a few seconds after upload.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before first deploy retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before second deploy retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry_2
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
